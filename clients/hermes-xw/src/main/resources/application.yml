server:
  port: 4378
  tomcat:
    max-swallow-size: -1
    connection-timeout: 600000
  max-http-form-post-size: -1

# 可选：大屏 ES（默认关闭，避免启动连不上）
es:
  enabled: false
  host: 192.168.3.226
  port: 9201
  scheme: https
  username: elastic
  password: "i7Smzj2wVUndynjJXXv76A=="
  connect-timeout: 10000
  socket-timeout: 600000
  agent-node-index: hermes_xw_agent_node

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.aw.entity
  mapper-locations: classpath:mapper/*.xml

graphiql:
  enabled: true

spring:
  application:
    name: hermes-xw
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hermes-xw1?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

# Hermes Agent API（对话续聊靠 hermes_session_id）
# api-key 必须与 D:\hermes-lixian\.env 里的 API_SERVER_KEY 一致（Java 不会自动读 Hermes 的 .env）
hermes:
  base-url: ${HERMES_API_BASE:http://127.0.0.1:8642}
  api-key: ${HERMES_API_KEY:change-me-local-dev}
  model: ${HERMES_API_MODEL:hermes}
  connect-timeout-ms: 10000
  # skill 研判可能很久
  read-timeout-ms: 1800000
  hbase:
    enabled: false
    zookeeper:
      quorum: ${HERMES_HBASE_ZK:192.168.3.171}
      port: ${HERMES_HBASE_ZK_PORT:2181}
    image-table: ${HERMES_HBASE_IMAGE_TABLE:collect_image_bytes}
    column-family: ${HERMES_HBASE_COLUMN_FAMILY:info}
    read-timeout-ms: ${HERMES_HBASE_READ_TIMEOUT_MS:3000}
    fail-cooldown-ms: ${HERMES_HBASE_FAIL_COOLDOWN_MS:60000}
    local-dir: ${HERMES_IMAGE_LOCAL_DIR:D:/hermes-lixian/data/image_bytes}
  video:
    public-base-url: ${HERMES_VIDEO_PUBLIC_BASE_URL:http://127.0.0.1:4378}
    local-dir: ${HERMES_VIDEO_LOCAL_DIR:D:/hermes-lixian/data/video_bytes}
    url-prefix: ${HERMES_VIDEO_URL_PREFIX:/video-files}
